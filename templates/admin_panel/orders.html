{% extends "admin_panel/base.html" %}
{% block title %}Pedidos — Panel{% endblock %}
{% block nav_orders %}active{% endblock %}
{% block page_title %}Pedidos{% endblock %}

{% block page_content %}
<div x-data="{
  orders: [], loading: true, search: '', statusFilter: '',
  sort: '', page: 1, pageSize: 20, totalCount: 0,
  selected: [],
  get totalPages() { return Math.ceil(this.totalCount / this.pageSize) },
  get allSelected() { return this.orders.length > 0 && this.selected.length === this.orders.length },
  toggleAll() {
    this.selected = this.allSelected ? [] : this.orders.map(o => o.id)
  },
  toggleOne(id) {
    const i = this.selected.indexOf(id)
    if (i === -1) this.selected.push(id)
    else this.selected.splice(i, 1)
  },
  async deleteSelected() {
    if (!this.selected.length) return
    if (!confirm(`¿Borrar ${this.selected.length} pedido(s)? Esta acción no se puede deshacer.`)) return
    try {
      const res = await fetch('/api/admin/orders/bulk-delete/', {
        method: 'POST',
        headers: { ...$store.adminAuth.headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: this.selected })
      })
      if (res.ok) { this.selected = []; this.load() }
    } catch {}
  },

  toggleSort(field) {
    if (this.sort === field) this.sort = '-' + field
    else if (this.sort === '-' + field) this.sort = ''
    else this.sort = field
    this.page = 1; this.load()
  },
  sortIcon(field) {
    if (this.sort === field) return '↑'
    if (this.sort === '-' + field) return '↓'
    return '↕'
  },

  async load() {
    this.loading = true
    const params = new URLSearchParams({ page: this.page, page_size: this.pageSize })
    if (this.search) params.set('search', this.search)
    if (this.statusFilter) params.set('status', this.statusFilter)
    if (this.sort) params.set('ordering', this.sort)
    try {
      const res = await fetch('/api/admin/orders/?' + params, { headers: $store.adminAuth.headers() })
      if (res.status === 401) { $store.adminAuth.logout(); return }
      if (res.ok) {
        const d = await res.json()
        if (Array.isArray(d)) { this.orders = d; this.totalCount = d.length }
        else { this.orders = d.results ?? []; this.totalCount = d.count ?? 0 }
      }
    } catch {}
    this.loading = false
  },

  statusLabel(s) {
    const M = { pending_deposit:'Esperando seña', deposit_paid:'Seña pagada', confirmed:'Confirmado', in_production:'En preparación', ready:'Listo para retirar', delivered:'Entregado', cancelled:'Cancelado' }
    return M[s] || s
  },
  statusClass(s) {
    const C = {
      cancelled:       'badge badge-red',
      pending_deposit: 'badge badge-purple',
      deposit_paid:    'badge badge-blue',
      confirmed:       'badge badge-green',
      in_production:   'badge badge-yellow',
      ready:           'badge badge-orange',
      delivered:       'badge badge-pink',
    }
    return C[s] ?? 'badge badge-grey'
  },
  fmt(n) { return Number(n||0).toLocaleString('es-AR') },
}"
x-init="load()">

  <!-- Filters -->
  <div class="flex flex-wrap gap-3 mb-4 items-center">
    <input type="search" x-model="search" @input.debounce.400ms="page=1; load()"
           placeholder="Buscar por cliente..."
           class="rounded-xl px-4 py-2 text-sm outline-none"
           style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff;min-width:200px"
           onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
    <select x-model="statusFilter" @change="page=1; load()"
            class="rounded-xl px-4 py-2 text-sm outline-none"
            style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff">
      <option value="">Todos los estados</option>
      <option value="pending_deposit">Esperando seña</option>
      <option value="deposit_paid">Seña pagada</option>
      <option value="confirmed">Confirmado</option>
      <option value="in_production">En preparación</option>
      <option value="ready">Listo</option>
      <option value="delivered">Entregado</option>
      <option value="cancelled">Cancelado</option>
    </select>
    <button x-show="selected.length > 0" @click="deleteSelected()"
            class="flex items-center gap-1.5 text-sm font-semibold rounded-xl px-4 py-2"
            style="background:rgba(231,76,60,0.1);color:#C0392B;border:1.5px solid rgba(231,76,60,0.25);cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Borrar (<span x-text="selected.length"></span>)
    </button>
  </div>

  <!-- Table card -->
  <div class="bg-white rounded-2xl" style="border:1px solid rgba(58,36,23,0.07);box-shadow:0 2px 12px rgba(58,36,23,0.05)">
    <div x-show="loading" class="flex justify-center py-16">
      <div style="width:36px;height:36px;border:2px solid #EFE2CB;border-top-color:#E285AF;border-radius:50%;animation:spin 1s linear infinite"></div>
    </div>

    <table class="data-table" x-show="!loading">
      <thead>
        <tr>
          <th style="width:36px">
            <input type="checkbox" :checked="allSelected" @change="toggleAll()"
                   style="width:15px;height:15px;cursor:pointer;accent-color:#E285AF">
          </th>
          <th>
            <button @click="toggleSort('id')" style="background:none;border:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:inherit">
              N° Pedido <span x-text="sortIcon('id')" style="font-size:0.8em;opacity:0.6"></span>
            </button>
          </th>
          <th>Cliente</th>
          <th>
            <button @click="toggleSort('created_at')" style="background:none;border:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:inherit">
              Fecha pedido <span x-text="sortIcon('created_at')" style="font-size:0.8em;opacity:0.6"></span>
            </button>
          </th>
          <th>
            <button @click="toggleSort('required_date')" style="background:none;border:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:inherit">
              Fecha entrega <span x-text="sortIcon('required_date')" style="font-size:0.8em;opacity:0.6"></span>
            </button>
          </th>
          <th>Total</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="o in orders" :key="o.id">
          <tr>
            <td>
              <input type="checkbox" :checked="selected.includes(o.id)" @change="toggleOne(o.id)"
                     style="width:15px;height:15px;cursor:pointer;accent-color:#E285AF">
            </td>
            <td class="font-semibold text-brown" x-text="'#' + o.id"></td>
            <td x-text="o.customer_name ?? o.customer?.name ?? '—'"></td>
            <td x-text="o.created_at ? o.created_at.split('T')[0] : '—'"></td>
            <td x-text="o.required_date ?? '—'"></td>
            <td x-text="'$' + fmt(o.total)"></td>
            <td><span :class="statusClass(o.status)" x-text="statusLabel(o.status)"></span></td>
            <td><a :href="'/admin/orders/' + o.id + '/'" class="text-xs font-semibold text-pink-deep no-underline hover:underline">Ver →</a></td>
          </tr>
        </template>
        <tr x-show="!loading && orders.length === 0">
          <td colspan="8" class="text-center py-10 text-brown-soft">No hay pedidos.</td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div x-show="totalPages > 1" class="flex items-center justify-between px-5 py-3" style="border-top:1px solid rgba(58,36,23,0.07)">
      <span class="text-xs text-brown-soft" x-text="totalCount + ' pedidos'"></span>
      <div class="flex gap-2">
        <button @click="page = Math.max(1, page-1); load()" :disabled="page <= 1"
                class="text-xs px-3 py-1.5 rounded-lg disabled:opacity-40"
                style="background:#F6EAD6;color:#5A3B29;border:none;cursor:pointer">Anterior</button>
        <span class="text-xs py-1.5 px-2 text-brown-soft" x-text="page + ' / ' + totalPages"></span>
        <button @click="page = Math.min(totalPages, page+1); load()" :disabled="page >= totalPages"
                class="text-xs px-3 py-1.5 rounded-lg disabled:opacity-40"
                style="background:#F6EAD6;color:#5A3B29;border:none;cursor:pointer">Siguiente</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
