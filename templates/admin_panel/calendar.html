{% extends "admin_panel/base.html" %}
{% block title %}Calendario — Panel{% endblock %}
{% block nav_calendar %}active{% endblock %}
{% block page_title %}Calendario{% endblock %}

{% block page_content %}
<div x-data="{
  orders: [], loading: true, viewDate: new Date(),
  get year() { return this.viewDate.getFullYear() },
  get month() { return this.viewDate.getMonth() },
  get monthName() {
    return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][this.month]
  },
  get days() {
    const first = new Date(this.year, this.month, 1).getDay()
    const total = new Date(this.year, this.month + 1, 0).getDate()
    const blanks = (first + 6) % 7  // Monday-first
    const days = []
    for (let i = 0; i < blanks; i++) days.push(null)
    for (let d = 1; d <= total; d++) days.push(d)
    return days
  },
  ordersForDay(d) {
    if (!d) return []
    const date = this.year + '-' + String(this.month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0')
    return this.orders.filter(o => o.required_date === date)
  },
  prevMonth() { this.viewDate = new Date(this.year, this.month - 1, 1) },
  nextMonth() { this.viewDate = new Date(this.year, this.month + 1, 1) },
  async load() {
    this.loading = true
    try {
      const res = await fetch('/api/admin/orders/orders/?page_size=200', { headers: $store.adminAuth.headers() })
      if (res.ok) { const d = await res.json(); this.orders = d.results ?? d }
    } catch {}
    this.loading = false
  },
}" x-init="load()">

  <!-- Header -->
  <div class="flex items-center gap-4 mb-5">
    <button @click="prevMonth()" class="p-2 rounded-xl" style="background:#fff;border:1px solid rgba(58,36,23,0.12);cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A3B29" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 class="font-fraunces font-bold text-brown" style="font-size:1.2rem;min-width:200px;text-align:center" x-text="monthName + ' ' + year"></h2>
    <button @click="nextMonth()" class="p-2 rounded-xl" style="background:#fff;border:1px solid rgba(58,36,23,0.12);cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A3B29" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Calendar grid -->
  <div class="bg-white rounded-2xl overflow-hidden" style="border:1px solid rgba(58,36,23,0.07);box-shadow:0 2px 12px rgba(58,36,23,0.05)">
    <!-- Day headers -->
    <div class="grid grid-cols-7" style="border-bottom:1px solid rgba(58,36,23,0.07)">
      <template x-for="d in ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']" :key="d">
        <div class="text-center py-3 text-xs font-semibold text-brown-soft uppercase tracking-wide" x-text="d"></div>
      </template>
    </div>

    <div x-show="loading" class="flex justify-center py-16">
      <div style="width:32px;height:32px;border:2px solid #EFE2CB;border-top-color:#E285AF;border-radius:50%;animation:spin 1s linear infinite"></div>
    </div>

    <!-- Weeks -->
    <div x-show="!loading" class="grid grid-cols-7" style="min-height:300px">
      <template x-for="(day, idx) in days" :key="idx">
        <div class="border-r border-b" style="border-color:rgba(58,36,23,0.06);min-height:80px;padding:6px"
             :style="day ? '' : 'background:#FAFAFA'">
          <span x-show="day" x-text="day" class="text-xs font-semibold" style="color:#5A3B29"></span>
          <template x-for="o in ordersForDay(day)" :key="o.id">
            <a :href="'/admin/orders/' + o.id + '/'"
               class="block mt-1 text-xs rounded-md px-1.5 py-0.5 truncate no-underline"
               style="background:rgba(240,160,196,0.25);color:#C25D8A"
               x-text="'#' + o.id + ' ' + (o.customer_name ?? o.customer?.name ?? '')">
            </a>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
{% endblock %}
