{% extends "base.html" %}
{% load static %}

{% block title %}Registrá tu negocio — Dulceras Team{% endblock %}

{% block content %}
<div class="min-h-screen font-poppins flex items-center justify-center p-4 relative overflow-hidden"
     style="background:#FDF6EC"
     x-data="{
       form: { name:'', slug:'', email:'', password:'', confirm_password:'', plan_slug:'basico' },
       error: '', loading: false,
       async submit() {
         if (this.form.password !== this.form.confirm_password) { this.error = 'Las contraseñas no coinciden.'; return }
         this.error = ''; this.loading = true
         try {
           const res = await fetch('/api/register/', {
             method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify(this.form)
           })
           const data = await res.json()
           if (!res.ok) throw new Error(Object.values(data).flat()[0] || 'Error al registrar.')
           $store.adminAuth.login(data.access, data.refresh, this.form.email)
           window.location.href = '/admin/dashboard/'
         } catch(e) {
           this.error = e.message
         } finally {
           this.loading = false
         }
       }
     }">

  <div aria-hidden="true" style="position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:repeating-linear-gradient(100deg,#FDF6EC 0%,#FDF6EC 7%,transparent 10%,transparent 12%,#FDF6EC 16%),repeating-linear-gradient(100deg,#F0A0C4 10%,#E285AF 15%,#EFE2CB 20%,#F7C4DD 25%,#F0A0C4 30%);
    background-size:300% 200%,200% 100%;filter:blur(40px);opacity:0.2;animation:aurora-move 60s linear infinite;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,black 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,black 10%,transparent 70%)"></div>

  <div class="w-full max-w-md relative" style="z-index:1">
    <div class="flex flex-col items-center mb-8">
      <img src="{% static 'brand/logo-icon.png' %}" alt="" style="height:64px;width:auto;margin-bottom:12px">
      <img src="{% static 'brand/logo-wordmark.png' %}" alt="Dulceras Team" style="height:48px;width:auto;margin-bottom:8px">
      <p class="text-brown-soft text-sm font-medium">Registrá tu negocio gastronómico</p>
    </div>

    <form @submit.prevent="submit()" class="bg-white rounded-2xl space-y-4"
          style="padding:32px 28px;box-shadow:0 10px 40px rgba(58,36,23,0.10)">

      <div x-show="error" class="flex items-center gap-2.5 text-sm rounded-xl px-4 py-3"
           style="background:#FFF0F0;border:1px solid rgba(226,133,175,0.3);color:#9B2335">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span x-text="error"></span>
      </div>

      <div>
        <label class="block text-sm font-medium text-brown-soft mb-1.5">Nombre del negocio *</label>
        <input type="text" x-model="form.name" required autofocus placeholder="Mi Pastelería"
               @input="form.slug = form.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')"
               class="w-full text-sm outline-none rounded-xl px-4 py-2.5"
               style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff"
               onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
      </div>
      <div>
        <label class="block text-sm font-medium text-brown-soft mb-1.5">Slug (URL) *</label>
        <input type="text" x-model="form.slug" required placeholder="mi-pasteleria"
               class="w-full text-sm outline-none rounded-xl px-4 py-2.5 font-mono"
               style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff"
               onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
        <p class="text-xs text-brown-soft mt-1">Solo letras minúsculas, números y guiones</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-brown-soft mb-1.5">Email *</label>
        <input type="email" x-model="form.email" required placeholder="hola@mi-negocio.com"
               class="w-full text-sm outline-none rounded-xl px-4 py-2.5"
               style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff"
               onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
      </div>
      <div>
        <label class="block text-sm font-medium text-brown-soft mb-1.5">Contraseña *</label>
        <input type="password" x-model="form.password" required placeholder="••••••••"
               class="w-full text-sm outline-none rounded-xl px-4 py-2.5"
               style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff"
               onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
      </div>
      <div>
        <label class="block text-sm font-medium text-brown-soft mb-1.5">Confirmar contraseña *</label>
        <input type="password" x-model="form.confirm_password" required placeholder="••••••••"
               class="w-full text-sm outline-none rounded-xl px-4 py-2.5"
               style="border:1.5px solid rgba(58,36,23,0.15);color:#3A2417;background:#fff"
               onfocus="this.style.borderColor='#E285AF'" onblur="this.style.borderColor='rgba(58,36,23,0.15)'">
      </div>

      <button type="submit" :disabled="loading"
              class="w-full text-sm font-semibold text-white rounded-xl py-3"
              :style="loading ? 'background:rgba(226,133,175,0.6);cursor:not-allowed;border:none' : 'background:linear-gradient(135deg,#F0A0C4,#E285AF);cursor:pointer;border:none;box-shadow:0 6px 18px rgba(226,133,175,0.45)'">
        <span x-text="loading ? 'Registrando...' : 'Crear cuenta gratuita'"></span>
      </button>
    </form>

    <p class="text-center text-sm text-brown-soft mt-5">
      ¿Ya tenés cuenta?
      <a href="/admin/login/" class="font-semibold no-underline" style="color:#E285AF">Ingresá</a>
    </p>
  </div>
</div>
{% endblock %}
