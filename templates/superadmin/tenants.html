{% extends "superadmin/base.html" %}
{% block title %}Tenants — Superadmin{% endblock %}
{% block nav_tenants %}active{% endblock %}
{% block page_title %}Tenants{% endblock %}

{% block page_content %}
<div x-data="{
  tenants: [], loading: true,
  async init() {
    try {
      const res = await fetch('/api/superadmin/tenants/', { headers: $store.adminAuth.headers() })
      if (res.ok) { const d = await res.json(); this.tenants = d.results ?? d }
    } catch {}
    this.loading = false
  },
  async toggle(t) {
    await fetch('/api/superadmin/tenants/' + t.id + '/', { method:'PATCH', headers: $store.adminAuth.headers(), body: JSON.stringify({ is_active: !t.is_active }) })
    await this.init()
  },
}">
  <div x-show="loading" class="flex justify-center py-16">
    <div style="width:36px;height:36px;border:2px solid rgba(240,160,196,0.3);border-top-color:#E285AF;border-radius:50%;animation:spin 1s linear infinite"></div>
  </div>

  <div class="sa-card overflow-hidden" x-show="!loading">
    <table class="sa-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Slug</th>
          <th>Plan</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="t in tenants" :key="t.id">
          <tr>
            <td class="font-medium text-white" x-text="t.name"></td>
            <td x-text="t.slug" style="font-family:monospace;font-size:0.8rem"></td>
            <td x-text="t.plan?.name ?? '—'"></td>
            <td>
              <span class="inline-flex items-center text-xs font-semibold px-2 py-1 rounded-full"
                    :style="t.is_active ? 'background:rgba(39,174,96,0.2);color:#5DE08A' : 'background:rgba(231,76,60,0.2);color:#F1948A'"
                    x-text="t.is_active ? 'Activo' : 'Inactivo'">
              </span>
            </td>
            <td class="flex gap-3">
              <a :href="'/superadmin/tenants/' + t.id + '/'" class="text-xs no-underline" style="color:#E285AF">Detalle →</a>
              <button @click="toggle(t)" class="text-xs" :style="t.is_active ? 'color:#F1948A' : 'color:#5DE08A'" style="background:none;border:none;cursor:pointer"
                      x-text="t.is_active ? 'Desactivar' : 'Activar'"></button>
            </td>
          </tr>
        </template>
        <tr x-show="!loading && tenants.length === 0">
          <td colspan="5" class="text-center py-10" style="color:#D8C4AC;opacity:.5">Sin tenants.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
