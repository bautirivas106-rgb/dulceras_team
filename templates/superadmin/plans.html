{% extends "superadmin/base.html" %}
{% block title %}Planes — Superadmin{% endblock %}
{% block nav_plans %}active{% endblock %}
{% block page_title %}Planes{% endblock %}

{% block page_content %}
<div x-data="{
  plans: [], loading: true,
  async init() {
    try {
      const res = await fetch('/api/superadmin/plans/', { headers: $store.adminAuth.headers() })
      if (res.ok) { const d = await res.json(); this.plans = d.results ?? d }
    } catch {}
    this.loading = false
  },
  fmt(n) { return Number(n||0).toLocaleString('es-AR') },
}">
  <div x-show="loading" class="flex justify-center py-16">
    <div style="width:36px;height:36px;border:2px solid rgba(240,160,196,0.3);border-top-color:#E285AF;border-radius:50%;animation:spin 1s linear infinite"></div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" x-show="!loading">
    <template x-for="p in plans" :key="p.id">
      <div class="sa-card">
        <div class="flex items-start justify-between mb-3">
          <h3 class="font-fraunces font-bold text-white" style="font-size:1rem" x-text="p.name"></h3>
          <span x-show="p.is_active" class="text-xs px-2 py-0.5 rounded-full font-semibold" style="background:rgba(39,174,96,0.2);color:#5DE08A">Activo</span>
        </div>
        <p class="font-fraunces font-bold" style="font-size:1.6rem;color:#E285AF" x-text="'$' + fmt(p.price_monthly) + '/mes'"></p>
        <ul class="mt-4 space-y-2 text-sm" style="color:#D8C4AC">
          <li x-text="p.max_products ? 'Hasta ' + p.max_products + ' productos' : 'Productos ilimitados'"></li>
          <li x-text="p.max_users ? 'Hasta ' + p.max_users + ' usuarios' : 'Usuarios ilimitados'"></li>
          <li x-text="p.has_mp_integration ? '✓ Integración Mercado Pago' : '✗ Sin MP'" :style="p.has_mp_integration ? 'color:#5DE08A' : ''"></li>
          <li x-text="p.has_whatsapp ? '✓ Notificaciones WhatsApp' : '✗ Sin WhatsApp'" :style="p.has_whatsapp ? 'color:#5DE08A' : ''"></li>
        </ul>
      </div>
    </template>
    <div x-show="!loading && plans.length === 0" class="sa-card">
      <p style="color:#D8C4AC;opacity:.5">Sin planes.</p>
    </div>
  </div>
</div>
{% endblock %}
