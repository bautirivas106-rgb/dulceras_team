{% extends "superadmin/base.html" %}
{% block title %}Tenant — Superadmin{% endblock %}
{% block nav_tenants %}active{% endblock %}
{% block page_title %}<a href="/superadmin/tenants/" style="color:#D8C4AC;opacity:.6;text-decoration:none;font-weight:400;font-size:0.9rem">Tenants</a> / Detalle{% endblock %}

{% block page_content %}
<div x-data="{
  tenant: null, loading: true,
  async init() {
    try {
      const res = await fetch('/api/superadmin/tenants/{{ tenant_id }}/', { headers: $store.adminAuth.headers() })
      if (res.ok) this.tenant = await res.json()
    } catch {}
    this.loading = false
  },
  fmt(n) { return Number(n||0).toLocaleString('es-AR') },
}">
  <div x-show="loading" class="flex justify-center py-16">
    <div style="width:36px;height:36px;border:2px solid rgba(240,160,196,0.3);border-top-color:#E285AF;border-radius:50%;animation:spin 1s linear infinite"></div>
  </div>

  <div x-show="!loading && tenant" class="max-w-xl">
    <div class="sa-card mb-4">
      <h2 class="font-fraunces font-bold text-white mb-4" style="font-size:1.1rem" x-text="tenant?.name"></h2>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div>
          <p class="text-xs uppercase tracking-wide mb-0.5" style="color:#E285AF">Slug</p>
          <p style="color:#D8C4AC;font-family:monospace" x-text="tenant?.slug"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide mb-0.5" style="color:#E285AF">Plan</p>
          <p style="color:#D8C4AC" x-text="tenant?.plan?.name ?? 'Sin plan'"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide mb-0.5" style="color:#E285AF">Estado</p>
          <p style="color:#D8C4AC" x-text="tenant?.is_active ? 'Activo' : 'Inactivo'"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide mb-0.5" style="color:#E285AF">Creado</p>
          <p style="color:#D8C4AC" x-text="tenant?.created_at ? tenant.created_at.split('T')[0] : '—'"></p>
        </div>
      </div>
    </div>
    <a href="/superadmin/tenants/" class="text-sm no-underline" style="color:#E285AF">← Volver a tenants</a>
  </div>
</div>
{% endblock %}
